name: fixture-chain
on: [push]
jobs:
  a:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.emit.outputs.go }}
    steps:
      - name: emit go
        id: emit
        run: echo "go=true" >> "$GITHUB_OUTPUT"
  b:
    runs-on: ubuntu-latest
    needs: a
    if: needs.a.outputs.go == 'true'
    steps:
      - name: gated step
        run: echo "b ran because a said go"
